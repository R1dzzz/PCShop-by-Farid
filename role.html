<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pilih Role — PC Shop</title>
  <link rel="stylesheet" href="css/role.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥</text></svg>" />
</head>
<body>

  <div class="particles">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <main class="role-container">
    <a href="landing.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Kembali
    </a>

    <div class="role-card fade-in-up">
      <div class="role-header">
        <div class="role-logo">🖥</div>
        <h1 class="role-title">Pilih Peran</h1>
        <p class="role-subtitle">Masuk sebagai siapa hari ini?</p>
      </div>

      <div class="role-grid">
        <!-- Pembeli -->
        <button class="role-option" onclick="selectRole('buyer')">
          <div class="role-icon-wrap buyer">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
          </div>
          <div class="role-name">Pembeli</div>
          <div class="role-desc">Lihat produk, tambah ke keranjang, dan checkout</div>
          <div class="role-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </button>

        <!-- Penjual -->
        <button class="role-option" onclick="selectRole('seller')">
          <div class="role-icon-wrap seller">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <div class="role-name">Penjual</div>
          <div class="role-desc">Kelola produk, tambah barang baru, dan transaksi</div>
          <div class="role-arrow">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
        </button>
      </div>
    </div>
  </main>

  <script>
    function selectRole(role) {
      localStorage.setItem('pcshop_role', role);
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
