<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Shop — POS System</title>
  <meta name="description" content="PC Shop Point of Sale System by Farid Alfiyansah" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥</text></svg>" />
</head>
<body>

<!-- ── Header ──────────────────────────────────────────────── -->
<header class="header">
  <div class="logo">
    <div class="logo-icon">🖥</div>
    <div>
      PC Shop
      <span class="logo-sub">Point of Sale System</span>
    </div>
  </div>
  <div class="header-right">
    <button id="logout-btn" class="logout-btn" title="Keluar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
    <div class="time-display" id="clock">--:--:--</div>
    <button id="theme-toggle" class="theme-toggle-btn" title="Toggle theme"></button>
    <div class="shortcut-hint hide-mobile"><kbd>F2</kbd> Checkout</div>
  </div>
</header>

<!-- ── Main Layout ──────────────────────────────────────────── -->
<div class="layout">

  <!-- LEFT: Product Panel -->
  <section class="left-panel">
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="Cari produk..." autocomplete="off" />
      </div>
      <div id="category-bar"></div>
    </div>
    <div class="section-title">Produk</div>
    <div id="product-grid"></div>
  </section>

  <!-- RIGHT: Cart / Transaction Panel (desktop only) -->
  <aside class="right-panel" id="right-panel">
    <div class="tabs">
      <button class="tab-btn active" id="tab-products">🛒 Transaksi</button>
      <button class="tab-btn" id="tab-history">📋 Riwayat</button>
    </div>

    <div class="tab-panel active" id="panel-products">
      <div class="cart-header">
        <div class="cart-title">
          Keranjang
          <span class="cart-badge" id="cart-count">0</span>
        </div>
        <button class="clear-btn" id="clear-btn">Hapus Semua</button>
      </div>
      <div id="cart-list">
        <div class="cart-empty"><span>🛒</span><p>Keranjang kosong</p></div>
      </div>
      <div class="payment-section">
        <div class="total-block">
          <div class="total-label">Total</div>
          <div id="total-price">Rp 0</div>
        </div>
        <div>
          <div class="pay-label">Jumlah Bayar</div>
          <input type="text" id="payment-input" placeholder="0" inputmode="numeric" />
        </div>
        <div class="change-row">
          <span class="change-label">Kembalian</span>
          <span id="change-amount">—</span>
        </div>
        <button id="checkout-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          Selesaikan Transaksi
          <span class="shortcut-key hide-mobile">F2</span>
        </button>
      </div>
    </div>

    <div class="tab-panel" id="panel-history">
      <div id="history-list"></div>
    </div>
  </aside>
</div>

<!-- ── Mobile Cart Overlay ────────────────────────────────────── -->
<div class="mobile-cart-overlay" id="mobile-cart-overlay"></div>

<!-- ── Mobile Cart Drawer ────────────────────────────────────── -->
<div class="mobile-cart-drawer" id="mobile-cart-drawer">
  <div class="mobile-drawer-handle"></div>
  <div class="mobile-drawer-header">
    <div class="cart-title">
      🛒 Keranjang
      <span class="cart-badge" id="cart-count-mobile">0</span>
    </div>
    <button class="drawer-close-btn" id="drawer-close-btn">✕</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="mob-tab-products">🛒 Transaksi</button>
    <button class="tab-btn" id="mob-tab-history">📋 Riwayat</button>
  </div>

  <div class="tab-panel active" id="mob-panel-products">
    <div class="cart-header" style="border-top:none; padding-top:8px;">
      <div style="font-size:12px; color: var(--text-muted); font-weight:600;">Item dipilih</div>
      <button class="clear-btn" id="clear-btn-mobile">Hapus Semua</button>
    </div>
    <div id="cart-list-mobile">
      <div class="cart-empty"><span>🛒</span><p>Keranjang kosong</p></div>
    </div>
    <div class="payment-section">
      <div class="total-block">
        <div class="total-label">Total</div>
        <div id="total-price-mobile">Rp 0</div>
      </div>
      <div>
        <div class="pay-label">Jumlah Bayar</div>
        <input type="text" id="payment-input-mobile" placeholder="0" inputmode="numeric" />
      </div>
      <div class="change-row">
        <span class="change-label">Kembalian</span>
        <span id="change-amount-mobile">—</span>
      </div>
      <button id="checkout-btn-mobile">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Selesaikan Transaksi
      </button>
    </div>
  </div>

  <div class="tab-panel" id="mob-panel-history">
    <div id="history-list-mobile"></div>
  </div>
</div>

<!-- ── Mobile FAB Cart Button ─────────────────────────────────── -->
<button class="mobile-cart-fab" id="mobile-cart-fab" aria-label="Buka Keranjang">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
    <line x1="3" y1="6" x2="21" y2="6"/>
    <path d="M16 10a4 4 0 0 1-8 0"/>
  </svg>
  <span class="fab-badge" id="fab-badge">0</span>
</button>

<!-- ── Receipt Modal ─────────────────────────────────────────── -->
<div id="receipt-modal">
  <div class="modal-box">
    <div class="modal-top">
      <div class="modal-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        Transaksi Berhasil!
      </div>
      <button id="modal-close">✕</button>
    </div>
    <div id="receipt-body"></div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────── -->
<div id="toast"></div>

<script>
  (function updateClock() {
    const el = document.getElementById('clock');
    const tick = () => {
      el.textContent = new Date().toLocaleTimeString('id-ID', { hour12: false });
    };
    tick();
    setInterval(tick, 1000);
  })();
</script>

<script src="js/app.js"></script>
</body>
</html>
